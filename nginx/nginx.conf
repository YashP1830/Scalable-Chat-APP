worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # ── WebSocket upgrade handling ───────────────────────────────────────
    # $connection_upgrade is "upgrade" for WebSocket handshakes and ""
    # (empty) for normal HTTP. This lets us keep upstream keepalive for
    # regular requests while still upgrading Socket.io connections.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";      # empty (not "close") so upstream keepalive works
    }

    # Real client IP for ip_hash + logging (Node sees the true address).
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host             $host;

    upstream api_servers {
        # 🛑 ip_hash is CRITICAL for Socket.io: it pins a client to one
        # backend so its polling/websocket handshake stays on one server.
        ip_hash;

        server chat-api-1:5000 max_fails=3 fail_timeout=30s;
        server chat-api-2:5000 max_fails=3 fail_timeout=30s;
        server chat-api-3:5000 max_fails=3 fail_timeout=30s;

        # Reuse upstream connections for non-websocket requests.
        keepalive 32;
    }

    server {
        listen 80;

        # Base64 images are POSTed inline (backend allows ~5mb JSON).
        client_max_body_size 12m;

        # Lightweight health endpoint for load-balancer / uptime checks.
        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://api_servers;

            # 🛑 MANDATORY for WebSockets to pass through Nginx.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Don't buffer streamed / long-poll responses.
            proxy_buffering off;

            # Keep idle WebSocket connections alive for up to 1 hour instead of
            # Nginx's default 60s (which would silently drop live sockets).
            proxy_connect_timeout 10s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;
        }
    }
}
