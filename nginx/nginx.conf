worker_processes 1;

events { 
    worker_connections 1024; 
}

http {
    upstream api_servers {
        # 🛑 ip_hash is CRITICAL for Socket.io! 
        # It ensures a user stays "stuck" to the same server.
        ip_hash;
        
        # We will tell Docker to spin up multiple instances of our API
        server chat-api-1:5000;
        server chat-api-2:5000;
        server chat-api-3:5000;
    }

    server {
        # Nginx listens on standard HTTP port 80
        listen 80;

        location / {
            # Route all traffic to the cluster we defined above
            proxy_pass http://api_servers;
            
            # 🛑 These headers are MANDATORY for WebSockets to pass through Nginx
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Pass the user's real IP address to Node.js
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}