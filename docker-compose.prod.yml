# ---------------------------------------------------------------------------
# PRODUCTION / LOAD-TEST STACK  — for the Oracle Cloud Always Free VM
# (2 OCPU / 12 GB Arm). Runs the FULL scaling architecture so k6 has something
# real to hammer: nginx → 3 API instances → Kafka → db-worker, plus Redis.
#
#   Normal run:        docker compose -f docker-compose.prod.yml up -d --build
#   Load-test run:     ARCJET_MODE=DRY_RUN docker compose -f docker-compose.prod.yml up -d --build
#
# nginx publishes port 80 (the only public port). Point k6 / the frontend at
# http://<VM_PUBLIC_IP>/ .
# ---------------------------------------------------------------------------
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
    # Kafka is not published to the host — only the containers talk to it.

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory-policy", "noeviction"]

  # --- 3 API instances behind nginx (matches nginx/nginx.conf upstream) ------
  chat-api-1: &api
    build: ./backend
    container_name: chat-api-1
    restart: unless-stopped
    # Public DNS so the mongodb+srv:// SRV lookup resolves inside the container.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PORT=5000
      - KAFKA_BROKER=kafka:9092
      - REDIS_URL=redis://redis:6379
      # Flip to DRY_RUN at launch time to let k6 through (see header).
      - ARCJET_MODE=${ARCJET_MODE:-LIVE}
    env_file:
      - ./backend/.env
    depends_on:
      - kafka
      - redis

  chat-api-2:
    <<: *api
    container_name: chat-api-2

  chat-api-3:
    <<: *api
    container_name: chat-api-3

  db-worker:
    build: ./backend
    container_name: chat-db-worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: node src/worker.js
    environment:
      - KAFKA_BROKER=kafka:9092
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      - kafka
      - redis

  analytics-worker:
    build: ./backend
    container_name: chat-analytics-worker
    restart: unless-stopped
    command: node src/analytics-worker.js
    environment:
      - KAFKA_BROKER=kafka:9092
    env_file:
      - ./backend/.env
    depends_on:
      - kafka

  # Internal load balancer only now — Caddy is the public entry point (below)
  # and terminates HTTPS, so nginx no longer needs a published host port.
  nginx:
    image: nginx:latest
    container_name: chat-load-balancer
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-api-1
      - chat-api-2
      - chat-api-3

  # Public front door: terminates real HTTPS (auto Let's Encrypt cert for the
  # Azure DNS name) and reverse-proxies to nginx. Required for the Vercel
  # frontend (https://) to call this API at all — browsers block "mixed
  # content" (https page calling an http API) and cross-site cookies require
  # a real Secure connection.
  caddy:
    image: caddy:latest
    container_name: chat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

volumes:
  caddy_data:
  caddy_config:
