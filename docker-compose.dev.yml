# ---------------------------------------------------------------------------
# LIGHTWEIGHT DEV STACK  (use instead of docker-compose.yml while coding)
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Differences from the full stack (which exists to demo horizontal scaling):
#   • 1 API instance instead of 3  → no nginx load balancer needed
#   • chat-api is published directly on :80 so the frontend .env is unchanged
#     (VITE_API_URL=http://localhost/api still works)
#   • plain redis:7-alpine instead of redis-stack (app only uses basic
#     strings / lists / sets — no RediSearch/JSON needed)
#   • Kafka JVM heap capped at 512MB so it stops eating your CPU/RAM
#
# Everything the code relies on (Kafka, Redis cache, db-worker, ticks) is here.
# ---------------------------------------------------------------------------
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka-broker
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 👇 Cap the JVM so Kafka stops hogging the machine.
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"

  redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Single API instance, published straight on port 80 (no nginx in dev).
  chat-api:
    build: ./backend
    container_name: chat-api
    restart: unless-stopped
    # Public DNS so the mongodb+srv:// SRV lookup works (Docker's embedded
    # resolver often can't do SRV → querySrv ECONNREFUSED).
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:5000"
    environment:
      - PORT=5000
      - KAFKA_BROKER=kafka:9092
      - REDIS_URL=redis://redis:6379
      # Defaults to LIVE; set ARCJET_MODE=DRY_RUN in your shell to let k6 through.
      - ARCJET_MODE=${ARCJET_MODE:-LIVE}
    env_file:
      - ./backend/.env
    depends_on:
      - kafka
      - redis

  db-worker:
    build: ./backend
    container_name: chat-db-worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: node src/worker.js
    environment:
      - KAFKA_BROKER=kafka:9092
      - REDIS_URL=redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      - kafka
      - redis

  # Optional: comment this out too if you don't need analytics while coding.
  analytics-worker:
    build: ./backend
    container_name: chat-analytics-worker
    restart: unless-stopped
    command: node src/analytics-worker.js
    environment:
      - KAFKA_BROKER=kafka:9092
    env_file:
      - ./backend/.env
    depends_on:
      - kafka
